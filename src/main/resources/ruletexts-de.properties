R-APP-007.category=Anwendung
R-APP-007.rationale=Die Anwendung enthält mehr Service Flows als das empfohlene Maximum (50). Sehr große Anwendungen sind schwer zu pflegen, lassen sich langsam im Process Designer öffnen und deployen und vermischen meist mehrere Geschäftsdomainen.
R-APP-007.guidance=Anwendung nach Geschäftsfähigkeiten aufteilen, wiederverwendbare Services und Business Objekte in Toolkits auslagern, ungenutzte Artefakte archivieren.
