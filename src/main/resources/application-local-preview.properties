# Local preview only: persistent Podman MariaDB, loopback HTTP binding, and external uploads.
quarkus.datasource.db-kind=mariadb
quarkus.datasource.username=${DB_USER:twxav2}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:8081}/${DB_NAME:twxav2}
quarkus.devservices.enabled=false
quarkus.test.continuous-testing=disabled
# Avoid walking persistent data and generated/dependency folders during the Dev UI workspace scan.
quarkus.dev-ui.workspace.ignore-folders=data,target,temp,node_modules,dist,.obsidian
quarkus.http.host=127.0.0.1
quarkus.http.port=8080
twxav2.uploads.dir=${UPLOAD_DIR}
