R-APP-012.guidance=Anwendung nach Geschäftsfähigkeiten aufteilen, wiederverwendbare Services und Business Objekte in Toolkits auslagern, ungenutzte Artefakte archivieren.
R-APP-013.title=Zu viele Prozesse (BPDs)
R-APP-013.category=Anwendung
R-APP-013.rationale=Die Anwendung enthält mehr Prozesse (BPDs) als das empfohlene Maximum (15). Sehr große Anwendungen sind schwer zu pflegen, lassen sich langsam im Process Designer öffnen und deployen und vermischen meist mehrere Geschäftsdomainen.
R-APP-013.guidance=Anwendung nach Geschäftsfähigkeiten aufteilen, wiederverwendbare Services und Business Objekte in Toolkits auslagern, ungenutzte Artefakte archivieren.
