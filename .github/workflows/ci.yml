name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and package
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/maven:3.10.0-eclipse-temurin-25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run backend tests and JaCoCo gate
        run: bash scripts/test.sh
      - name: Package Quarkus application
        run: mvn -B -ntp -DskipTests package

  frontend:
    name: Frontend lint, tests, and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Set up pinned npm
        run: npm install --global npm@12.2.1 --no-audit --no-fund
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Lint frontend
        run: bash scripts/lint.sh
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build
