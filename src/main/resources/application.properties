quarkus.application.name=twx-analyzer-v2
quarkus.http.port=8080
quarkus.http.limits.max-body-size=500M
# Bound concurrent connections and keep multipart temporary files beside application uploads.
quarkus.http.limits.max-connections=${HTTP_MAX_CONNECTIONS:16}
quarkus.http.body.delete-uploaded-files-on-end=true
quarkus.http.body.uploads-directory=${UPLOAD_DIR:${user.home}/twx-analyzer-v2/data/uploads}/.multipart

# ---- Database (default: MariaDB; DB2 variant: -Dquarkus.datasource.db-kind=db2) ----
quarkus.datasource.db-kind=mariadb
quarkus.datasource.username=${DB_USER:twxav2}
quarkus.datasource.password=${DB_PASSWORD:}
quarkus.datasource.jdbc.url=jdbc:mariadb://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:twxav2}
quarkus.datasource.jdbc.max-size=10

quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.database.generation.halt-on-error=true

# Ingest (parse + analyze + persist) runs in a single transaction. Large TWX
# imports can exceed the default timeout; override it with TX_TIMEOUT.
quarkus.transaction-manager.default-transaction-timeout=${TX_TIMEOUT:600S}

# ---- API documentation ----
quarkus.swagger-ui.always-include=true

# ---- Upload directory ----
twxav2.uploads.dir=${UPLOAD_DIR:${user.home}/twx-analyzer-v2/data/uploads}
# Maximum number of concurrent upload/BPM-import jobs in the queue.
twxav2.ingest.concurrency=${INGEST_CONCURRENCY:2}
twxav2.ingest.queue-capacity=${INGEST_QUEUE_CAPACITY:4}
twxav2.ingest.max-work-bytes=${INGEST_MAX_WORK_BYTES:4294967296}

# Per-archive budgets (bytes/counts); total expanded bytes includes nested toolkit ZIP contents.
twxav2.parser.max-archive-bytes=${TWX_MAX_ARCHIVE_BYTES:2147483648}
twxav2.parser.max-entry-count=${TWX_MAX_ENTRY_COUNT:100000}
twxav2.parser.max-object-count=${TWX_MAX_OBJECT_COUNT:50000}
twxav2.parser.max-expanded-bytes=${TWX_MAX_EXPANDED_BYTES:4294967296}
twxav2.parser.max-retained-content-bytes=${TWX_MAX_RETAINED_CONTENT_BYTES:268435456}
twxav2.parser.max-toolkit-count=${TWX_MAX_TOOLKIT_COUNT:128}
twxav2.parser.max-toolkit-bytes=${TWX_MAX_TOOLKIT_BYTES:268435456}
twxav2.parser.max-total-toolkit-bytes=${TWX_MAX_TOTAL_TOOLKIT_BYTES:1073741824}

# ---- Automatic exclusions ("do not analyze"): object-name substrings (case-insensitive;
# applies to project and toolkit objects) and Process Center tags (project objects only,
# from META-INF/metadata.xml). Comma-separated lists; can be extended per app in rule
# settings (excludeNamePatterns/excludeTags). ----
twxav2.exclusion.name-patterns=${EXCLUSION_NAME_PATTERNS:_deprecated}
twxav2.exclusion.tags=${EXCLUSION_TAGS:}

# ---- Quality gate (B9, CI): maxCritical=0 means "no critical findings";
# maxMajor=-1 means unchecked; minHealth ranges from 0 to 100. Query parameters
# on the gate endpoint override these values per request. ----
twxav2.gate.max-critical=${GATE_MAX_CRITICAL:0}
twxav2.gate.max-major=${GATE_MAX_MAJOR:-1}
twxav2.gate.min-health=${GATE_MIN_HEALTH:70}

# ---- API access: no application login; deployments must keep the service on
# the trusted intranet (the container scripts publish only on loopback). ----
# Optional token for machine exports; when set /api/export/* requires X-API-Token.
twxav2.api.token=${API_TOKEN:}

# ---- Direct BPM import (ADR-010) ----
# PEM CA bundle for the BPM TLS connection; empty means system CAs only. The CA
# file configured in the settings UI (bpm_settings.ca_file) takes precedence.
twxav2.bpm.ca-file=${BPM_CA_FILE:}
twxav2.bpm.request-timeout-seconds=${BPM_REQUEST_TIMEOUT:60}
twxav2.bpm.export-timeout-seconds=${BPM_EXPORT_TIMEOUT:600}
twxav2.bpm.max-export-bytes=${BPM_MAX_EXPORT_BYTES:2147483648}
twxav2.bpm.default-base-url=${BPM_DEFAULT_BASE_URL:}
# Comma-separated HTTPS origins allowed to receive stored BAW credentials.
# When empty, only the origin from BPM_DEFAULT_BASE_URL is allowed.
twxav2.bpm.allowed-origins=${BPM_ALLOWED_ORIGINS:}

# ---- Encryption for stored secrets (BAW password) ----
# Master secret for AES-256-GCM (PBKDF2-derived, with a per-record salt).
# Empty means plaintext storage for compatibility in non-production profiles only.
twxav2.security.db-secret=${DB_SECRET:}
# Set only during rotation: existing encrypted values are re-encrypted at startup.
twxav2.security.db-secret-previous=${DB_SECRET_PREVIOUS:}

# ---- Test profile (@QuarkusTest): in-memory H2 instead of MariaDB; schema from entities ----
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:twxtest;DB_CLOSE_DELAY=-1
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%test.quarkus.hibernate-orm.statistics=true
%test.quarkus.devservices.enabled=false
%test.quarkus.http.test-port=0
%test.quarkus.http.limits.max-connections=512
%test.twxav2.uploads.dir=target/test-uploads
%test.quarkus.http.body.uploads-directory=target/test-uploads/.multipart
