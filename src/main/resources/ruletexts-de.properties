R-APP-014.category=Anwendung
R-APP-014.rationale=Die Anwendung enthält mehr Business Objekte als das empfohlene Maximum (50). Sehr große Anwendungen sind schwer zu pflegen, lassen sich langsam im Process Designer öffnen und deployen und vermischen meist mehrere Geschäftsdomainen.
R-APP-014.guidance=Anwendung nach Geschäftsfähigkeiten aufteilen, wiederverwendbare Services und Business Objekte in Toolkits auslagern, ungenutzte Artefakte archivieren.
R-APP-015.title=Zu viele Undercover Agents
R-APP-015.category=Anwendung
R-APP-015.rationale=Die Anwendung enthält mehr Undercover Agents als das empfohlene Maximum (25). Sehr große Anwendungen sind schwer zu pflegen, lassen sich langsam im Process Designer öffnen und deployen und vermischen meist mehrere Geschäftsdomainen.
R-APP-015.guidance=Anwendung nach Geschäftsfähigkeiten aufteilen, wiederverwendbare Services und Business Objekte in Toolkits auslagern, ungenutzte Artefakte archivieren.
R-APP-016.title=Zu viele Exposed Process Values
R-APP-016.category=Anwendung
R-APP-016.rationale=Die Anwendung enthält mehr Exposed Process Values als das empfohlene Maximum (25). Sehr große Anwendungen sind schwer zu pflegen, lassen sich langsam im Process Designer öffnen und deployen und vermischen meist mehrere Geschäftsdomainen.
R-APP-016.guidance=Anwendung nach Geschäftsfähigkeiten aufteilen, wiederverwendbare Services und Business Objekte in Toolkits auslagern, ungenutzte Artefakte archivieren.
R-APP-017.title=Zu viele Web Services
R-APP-017.category=Anwendung
R-APP-017.rationale=Die Anwendung enthält mehr Web Services als das empfohlene Maximum (25). Sehr große Anwendungen sind schwer zu pflegen, lassen sich langsam im Process Designer öffnen und deployen und vermischen meist mehrere Geschäftsdomainen.
R-APP-017.guidance=Anwendung nach Geschäftsfähigkeiten aufteilen, wiederverwendbare Services und Business Objekte in Toolkits auslagern, ungenutzte Artefakte archivieren.
R-APP-018.title=Zu viele Service Level Agreements
R-APP-018.category=Anwendung
R-APP-018.rationale=Die Anwendung enthält mehr Service Level Agreements als das empfohlene Maximum (15). Sehr große Anwendungen sind schwer zu pflegen, lassen sich langsam im Process Designer öffnen und deployen und vermischen meist mehrere Geschäftsdomainen.
R-APP-018.guidance=Anwendung nach Geschäftsfähigkeiten aufteilen, wiederverwendbare Services und Business Objekte in Toolkits auslagern, ungenutzte Artefakte archivieren.
R-APP-019.title=Umgebungsvariablen ohne Wert
R-APP-019.category=Anwendung
R-APP-019.rationale=Eine Umgebungsvariable hat in der Anwendung keinen Standardwert. Services, die tw.env.X lesen, erhalten zur Laufzeit einen leeren String, sofern nicht jede Umgebung per Hand konfiguriert ist.
R-APP-019.guidance=Jeder Umgebungsvariable einen sinnvollen Standardwert in den Anwendungseinstellungen geben und dokumentieren, welche Umgebungen sie überschreiben müssen.
R-DEP-001.title=Zyklische Toolkit-Abhängigkeit
R-DEP-001.category=Abhängigkeiten
R-DEP-001.rationale=Toolkits hängen zyklisch voneinander ab (A braucht B, B braucht A). Das Process Center akzeptiert das in manchen Versionen, aber Installationen, Upgrades und Snapshot-Migrationen werden fragil und die Toolkits lassen sich nicht unabhängig versionieren.
R-DEP-001.guidance=Zyklus auflösen: gemeinsame Artefakte in ein darunterliegendes Common-Toolkit verschieben, das beide referenzieren, oder die beiden Toolkits zusammenlegen.
R-DEP-002.title=Rekursiver Service-Aufrufzyklus
R-DEP-002.category=Abhängigkeiten
R-DEP-002.rationale=Services rufen sich gegenseitig in einem Zyklus auf (direkt oder über andere Services). Ohne eine Guard-Bedingung, die die Rekursion beendet, endet das in Stack Overflow oder Endlosschleife und ist sehr schwer zu debuggen.
R-DEP-002.guidance=Services umstrukturieren, damit der Aufrufgraph zyklenfrei ist; wenn Rekursion gewollt ist, eine explizite Tiefenbegrenzung als Variable einbauen und dokumentieren.
R-DEP-003.title=Ungenutzter Service
R-DEP-003.category=Abhängigkeiten
R-DEP-003.rationale=Ein Service der Anwendung wird von keinem Prozess, Service, Coach, UCA, Web Service und keiner Exposition referenziert. Tote Artefakte werden trotzdem deployt, analysiert und migriert.
R-DEP-003.guidance=Service löschen oder dort exponieren/ankoppeln, wo er genutzt werden soll. Vor dem Löschen die Process-Center-Ansicht „Where used“ prüfen.
R-DEP-004.title=Ungenutztes Business Objekt
R-DEP-004.category=Abhängigkeiten
R-DEP-004.rationale=Ein Business Objekt wird von keiner Variable, keinem Parameter, keiner Property, keinem Coach-View-Binding und keinem Service referenziert.
R-DEP-004.guidance=Ungenutzte Business Objekte löschen, um das Datenmodell übersichtlich zu halten.
R-DEP-005.title=Ungenutzte Coach View
R-DEP-005.category=Abhängigkeiten
R-DEP-005.rationale=Eine Coach View wird von keinem Coach, Human Service oder anderer Coach View verwendet.
R-DEP-005.guidance=Coach View löschen oder, wenn sie zur Wiederverwendung gedacht ist, in ein UI-Toolkit verschieben.
R-DEP-006.title=Referenz auf ein fehlendes Artefakt
R-DEP-006.category=Abhängigkeiten
R-DEP-006.rationale=Ein Objekt referenziert eine Artefakt-ID, die es in der Anwendung oder in den gebündelten Toolkits nicht gibt (gelöschtes Artefakt, falsche Toolkit-Version oder eine Abhängigkeit, die nicht Teil des Exports ist).
R-DEP-006.guidance=Objekt im Process Designer öffnen, die defekte Referenz reparieren (Service, Business Objekt oder Coach View neu wählen) und neu exportieren; prüfen, dass alle Abhängigkeiten enthalten sind.
R-SVC-001.title=Schritt nicht in den Ablauf eingebunden
R-SVC-001.category=Dienste
R-SVC-001.rationale=Ein Schritt des Services hat keinen eingehenden Link (und ist nicht der Startschritt) oder keinen ausgehenden Link (und ist kein End-/Exit-Schritt). Das ist entweder toter Code oder ein Ablauf, der stoppt, ohne einen Endpunkt zu erreichen.
R-SVC-001.guidance=Schritt in den Ablauf einbinden oder löschen. Jeder Pfad sollte in einem End-/Exit-Punkt enden.
R-SVC-002.title=Service ohne Startschritt
R-SVC-002.category=Dienste
R-SVC-002.rationale=Der Service hat Schritte, aber kein Start-Item ist definiert; er kann nicht ausgeführt werden.
R-SVC-002.guidance=Servicediagramm öffnen und den Start-Knoten mit dem ersten Schritt verbinden.
R-SVC-003.title=Leerer oder nicht implementierter Schritt
R-SVC-003.category=Dienste
R-SVC-003.rationale=Ein Script-Schritt hat keinen Code, oder ein Service-/Unterprozess-Aufruf zeigt ins Leere. Der Schritt tut zur Laufzeit nichts, was meist eine unfertige Implementierung versteckt.
R-SVC-003.guidance=Schritt implementieren oder aus dem Ablauf entfernen.
R-SVC-004.title=Aufruf eines Services, der nicht im Export enthalten ist
R-SVC-004.category=Dienste
R-SVC-004.rationale=Ein Schritt ruft einen Service auf, dessen ID in der Anwendung oder ihren Toolkits nicht existiert (gelöscht oder in einer nicht gebündelten Toolkit-Version). Der Service schlägt zur Laufzeit fehl.
R-SVC-004.guidance=Schritt wieder an einen vorhandenen Service binden; die Versionen der Toolkit-Abhängigkeiten prüfen.
R-SVC-005.title=Schleife ohne Ausstieg im Serviceablauf
R-SVC-005.category=Dienste
R-SVC-005.rationale=Die Links bilden einen Zyklus, aus dem kein Link der Schritte herausführt (keine Bedingung kann ihn verlassen). Der Service looppt für immer oder bis die Transaktion timeoutet.
R-SVC-005.guidance=Entscheidung (Switch) mit Ausstiegsbedingung einbauen, Schleifenzähler mit Maximum, oder den Ablauf umstrukturieren.
R-SVC-006.title=Keine Fehlerbehandlung in einem Service, der andere Services aufruft
R-SVC-006.category=Dienste
R-SVC-006.rationale=Der Service ruft Unterservices/Integrationen auf, aber weder der Service noch die aufrufenden Schritte haben einen Fehlerhandler. Eine Ausnahme erscheint als fehlgeschlagene Aufgabe oder Instanz mit generischer Meldung.
R-SVC-006.guidance=Einen Fehlerhandler (Catch) an die Integrations-/Aufrufschritte hängen oder den Service-Level-Fehlerhandler aktivieren, den Fehler loggen und auf ein fachlich verwertbares Ergebnis abbilden.
R-SVC-007.title=Fehlerhandler looppt zurück in den fehlerschlagenden Schritt
R-SVC-007.category=Dienste
R-SVC-007.rationale=Der Fehlerpfad eines Schritts führt zurück in denselben Schritt (Retry ohne Zähler), was den Fehler endlos wiederholt.
R-SVC-007.guidance=Retry-Zähler mit Maximum einbauen oder den Fehler in einen Endzustand / eine Benachrichtigung leiten.
R-SVC-008.title=Zu viele Eingabe- oder Ausgabeparameter
R-SVC-008.category=Dienste
R-SVC-008.rationale=Der Service hat mehr als 15 Eingabe- oder Ausgabeparameter. Lange Parameterlisten machen den Service schwer aufrufbar und schwer änderbar; sie deuten meist auf fehlende Business Objekte hin.
R-SVC-008.guidance=Zusammengehörige Parameter in einem Business Objekt bündeln.
R-SVC-009.title=Ungenutzte Variable
R-SVC-009.category=Dienste
R-SVC-009.rationale=Eine private Variable oder ein Parameter des Services wird in keinem Script, Mapping oder Coach-Binding des Services referenziert.
R-SVC-009.guidance=Variable entfernen; ungenutzte Variablen verwirren Wartende und kosten trotzdem Serialisierungsaufwand.
R-SVC-010.title=Script auf dem Exit-Punkt
R-SVC-010.category=Dienste
R-SVC-010.rationale=Code an einem End-/Exit-Punkt läuft, nachdem die Ausgaben bereits gemappt sind; er ist beim Lesen des Ablaufs leicht zu übersehen und kann nicht fehlerbehandelt werden.
R-SVC-010.guidance=Logik in einen Script-Schritt vor dem Exit verschieben.
R-SVC-011.title=Zu viele Coaches in einem Human Service
R-SVC-011.category=Dienste
R-SVC-011.rationale=Ein Human Service mit mehr als 5 Coaches ist schwer nachvollziehbar und schwer zu testen; er enthält meist mehrere Aufgaben in einem Service.
R-SVC-011.guidance=Human Service nach Aufgaben aufteilen oder wiederverwendbare Screens als verschachtelte Client-seitige Human Services / Coach Views bauen.
R-SVC-012.title=Stay-on-Page direkt nach einem Postpone
R-SVC-012.category=Dienste
R-SVC-012.rationale=Ein Stay-On-Page-Event folgt auf einen Postpone-Schritt; die zurückgestellte Aufgabe wird sofort wieder aufgenommen, was den Postpone aushebelt.
R-SVC-012.guidance=Postpone in einen Endzustand leiten oder das Stay-on-Page-Event entfernen.
R-SVC-013.title=Entscheidung (Switch) ohne Standardpfad
R-SVC-013.category=Dienste
R-SVC-013.rationale=Ein Switch-Schritt hat nur bedingte ausgehende Links. Wenn keine Bedingung passt, stoppt der Ablauf stillschweigend mitten im Service.
R-SVC-013.guidance=Einen unbedingten Link (Standard/Otherwise) vom Switch ausgehend anlegen.
R-SVC-014.title=Schritt-Logging / -Tracing aktiviert
R-SVC-014.category=Dienste
R-SVC-014.rationale=Ein Schritt hat Ausführungs-Logging oder Tracing aktiviert. In Produktion schreibt das jede Ausführung in Logs/Trace-Tabellen und verlangsamt den Service.
R-SVC-014.guidance=Logging und Tracing am Schritt vor dem Release deaktivieren (nur zum Debuggen nutzen).
R-SVC-015.title=Service ohne Dokumentation
R-SVC-015.category=Dokumentation
R-SVC-015.rationale=Der Service hat keinen Dokumentationstext.
R-SVC-015.guidance=Zweck, Eingaben/Ausgaben und Nebeneffekte im Dokumentationsfeld des Services beschreiben.
R-SVC-016.title=Variablenname folgt nicht camelCase
R-SVC-016.category=Namensgebung
R-SVC-016.rationale=Ein Variablen- oder Parametername ist nicht lowerCamelCase (beginnt groß, enthält Leerzeichen, Unterstriche oder Sonderzeichen). Einheitliche Namen machen Mappings und Skripte lesbar und vermeiden Escaping-Probleme.
R-SVC-016.guidance=Variable auf lowerCamelCase umbenennen (z. B. customerId) und die Mappings aktualisieren.
R-SVC-017.title=Variable ohne Dokumentation
R-SVC-017.category=Dokumentation
R-SVC-017.rationale=Ein Parameter hat keine Beschreibung. Aufrufer des Services sehen nicht, was er erwartet.
R-SVC-017.guidance=Jeden Eingabe- und Ausgabeparameter dokumentieren.
R-SVC-018.title=Zu viele verschachtelte client-seitige Human Services
R-SVC-018.category=Dienste
R-SVC-018.rationale=Ein Client-seitiger Human Service verschachtelt mehr als 25 andere Client-seitige Human Services (direkt). Sehr tiefe UI-Verschachtelung verlangsamt die Coach-Erzeugung und den Browser.
R-SVC-018.guidance=UI-Struktur mit Coach Views statt verschachtelter Services abflachen.
R-SVC-019.title=Heritage Human Service
R-SVC-019.category=Migration
R-SVC-019.rationale=Der Service ist ein Heritage Human Service (serverseitig). Heritage Human Services sind in BAW deprecated; sie können die modernen Coach-Funktionen nicht nutzen und werden aus neueren Releases entfernt.
R-SVC-019.guidance=Human Service in einen Client-seitigen Human Service konvertieren (Konvertierungsassistent im Process Designer) und die Coaches neu testen.
R-BPD-001.title=Gateway ohne Standardpfad
R-BPD-001.category=Prozess
R-BPD-001.rationale=Ein exklusives/inklusive Gateway hat nur bedingte ausgehende Flüsse. Wenn keine Bedingung wahr ist, geht das Token verloren und die Instanz hängt am Gateway.
R-BPD-001.guidance=Einen ausgehenden Fluss als Standard (ohne Bedingung) markieren oder die Bedingungen vollständig machen.
R-BPD-002.title=Aktivität ohne Implementierung
R-BPD-002.category=Prozess
R-BPD-002.rationale=Eine Aktivität hat keinen gekoppelten Service/Prozess/kein Script (Phantom-Schritt). Die Instanz bleibt bei der Aktivität stehen oder schließt sie, ohne etwas zu tun.
R-BPD-002.guidance=Implementierung an die Aktivität koppeln oder die Aktivität löschen.
R-BPD-003.title=Implementierung nicht im Export enthalten
R-BPD-003.category=Prozess
R-BPD-003.rationale=Eine Aktivität referenziert einen Service oder Prozess, den es in der Anwendung oder ihren gebündelten Toolkits nicht gibt.
R-BPD-003.guidance=Aktivität wieder an eine vorhandene Implementierung binden und die Toolkit-Versionen prüfen.
R-BPD-004.title=Ablaufobjekt nicht verbunden
R-BPD-004.category=Prozess
R-BPD-004.rationale=Eine Aktivität, ein Gateway oder ein Ereignis hat keinen eingehenden oder keinen ausgehenden Sequenzfluss.
R-BPD-004.guidance=Element verbinden oder entfernen; jeder Pfad muss ein Endereignis erreichen.
R-BPD-005.title=Schleife ohne Ausstieg
R-BPD-005.category=Prozess
R-BPD-005.rationale=Sequenzflüsse bilden einen Zyklus, aus dem kein Fluss herausführt: Der Prozess kann endlos looppen (jede Iteration erzeugt Aufgaben und Tracking-Daten).
R-BPD-005.guidance=Ausstiegsbedingung an einem Gateway in der Schleife oder einen Zähler mit Maximum einbauen.
R-BPD-006.title=Humane Aufgabe in einer System-Spur
R-BPD-006.category=Prozess
R-BPD-006.rationale=Eine User Task (Human Service) liegt in einer System-Spur; sie wird dem System-Participant zugeordnet und erscheint in keinem Postfach.
R-BPD-006.guidance=Aktivität in eine Spur mit dem richtigen Team verschieben oder die Implementierung auf einen System-Service umstellen.
R-BPD-007.title=Spur oder Team auf All Users gesetzt
R-BPD-007.category=Prozess
R-BPD-007.rationale=Eine Spur (oder ihr Team) ist an den Default-Participant „All Users“ gebunden. Aufgaben werden für alle sichtbar – ein Sicherheits- und Benutzerproblem.
R-BPD-007.guidance=Der Spur ein dediziertes Team (Participant Group) zuweisen und dessen Mitglieder verwalten.
R-BPD-008.title=Multi-Instance-Schleife auf einer System-Aktivität
R-BPD-008.category=Prozess
R-BPD-008.rationale=Eine Multi-Instance-Schleife (MIL) läuft auf einer Aktivität in einer System-Spur. Jede Iteration läuft als eigene Aufgabe/Transaktion, was bei großen Listen langsam ist; dasselbe Ergebnis erreicht meist eine Schleife im Service.
R-BPD-008.guidance=Iteration im Service-Flow implementieren oder sicherstellen, dass die Liste klein und das Verhalten gewollt ist.
R-BPD-009.title=Nachrichtenereignis ohne Undercover Agent
R-BPD-009.category=Prozess
R-BPD-009.rationale=Ein Nachrichten-Ereignis (Start/Intermediate) hat keinen Undercover Agent; das Ereignis kann nie feuern.
R-BPD-009.guidance=Den Undercover Agent, der die Nachricht liefert, anhängen oder das Ereignis entfernen.
R-BPD-010.title=Script auf einem Start- oder Endereignis
R-BPD-010.category=Prozess
R-BPD-010.rationale=Code auf Start-/Endereignissen ist für den Leser des Diagramms versteckt und läuft außerhalb jeder Aktivität (keine Fehlerbehandlung, kein Tracking).
R-BPD-010.guidance=Code in eine System-Aktivität (Script/Service) neben dem Ereignis verschieben.
R-BPD-011.title=Aktivität ohne Fehlerbehandlung
R-BPD-011.category=Prozess
R-BPD-011.rationale=Eine System-Aktivität, die einen Service aufruft, hat kein Fehler-Grenzereignis, und der Prozess hat keine globale Fehlerbehandlung; ein Fehler hinterlässt die Instanz im Failed-Zustand ohne fachliche Reaktion.
R-BPD-011.guidance=Ein Fehler-Zwischenereignis an die Aktivität (oder ein Prozess-Level-Fehlerereignis) hängen und auf einen Behandlungspfad leiten (Retry, Benachrichtigung, Kompensation).
R-BPD-012.title=Zu viele durchsuchbare Variablen
R-BPD-012.category=Prozess
R-BPD-012.rationale=Mehr als 25 Prozessvariablen sind als durchsuchbar / in Process Portal verfügbar markiert. Jedes durchsuchbare Feld wird bei jedem Speichern indiziert, was Instanz-Updates und Portalsuchen verlangsamt.
R-BPD-012.guidance=Nur die Felder behalten, die Nutzer wirklich suchen (typisch unter 10); eine Eigensuche über eine Business-Daten-Tabelle erwägen.
R-BPD-013.title=Lange Kette sequentieller Aktivitäten in einer Spur
R-BPD-013.category=Prozess
R-BPD-013.rationale=Viele Aktivitäten folgen in derselben Spur ohne Gateways aufeinander („Perlenschnur“). Jede Aktivität ist eine eigene Aufgabe mit eigener Persistierung und Navigation; dieselbe Arbeit in einem Service ist schneller und für den Nutzer einfacher.
R-BPD-013.guidance=Sequenzielle System-Aktivitäten zu einem Service-Flow zusammenfassen; sequenzielle humane Aufgaben desselben Bearbeiters zu einem Human Service mit mehreren Coaches zusammenfassen.
R-BPD-014.title=System-Aufgabe wird nach Abschluss nicht aufgeräumt
R-BPD-014.category=Prozess
R-BPD-014.rationale=Aktivitäten in System-Spuren behalten ihre abgeschlossenen Aufgaben; über die Zeit wachsen die Aufgabentabellen und verlangsamen das ganze System.
R-BPD-014.guidance=„Task bei Abschluss löschen“ (Cleanup) auf System-Aktivitäten aktivieren, die keine Aufgabenhistorie brauchen.
R-BPD-015.title=Aktivität ohne Beschreibung oder Betreff
R-BPD-015.category=Dokumentation
R-BPD-015.rationale=Eine User-Aktivität hat keinen Task-Betreff und/oder keine Beschreibung; Process Portal zeigt dem Nutzer einen leeren oder technischen Titel.
R-BPD-015.guidance=Task-Betreff (was zu tun ist) und Beschreibung (Anleitung) auf der Aktivität setzen.
R-BPD-016.title=Prozess ohne Dokumentation
R-BPD-016.category=Dokumentation
R-BPD-016.rationale=Der Prozess hat keine Dokumentation.
R-BPD-016.guidance=Geschäftlichen Zweck, Auslöser und Ergebnisse in der Prozessdokumentation beschreiben.
R-BPD-017.title=Prozessvariablenname nicht lowerCamelCase
R-BPD-017.category=Namensgebung
R-BPD-017.rationale=Ein Prozessvariablenname ist nicht lowerCamelCase.
R-BPD-017.guidance=Auf lowerCamelCase umbenennen und die Mappings aktualisieren.
R-BPD-018.title=Ungenutzte Prozessvariable
R-BPD-018.category=Prozess
R-BPD-018.rationale=Eine Prozessvariable wird in keinem Mapping, keiner Bedingung und keinem Script des Prozesses verwendet.
R-BPD-018.guidance=Variable entfernen.
R-BPD-019.title=Timer-Ereignis ohne Dauer oder auf dem kritischen Pfad
R-BPD-019.category=Prozess
R-BPD-019.rationale=Timer-Grenzereignisse werden zur Prüfung aufgelistet: sicherstellen, dass die Dauern über EPVs konfiguriert sind (nicht hartkodiert) und dass das Wiederolverhalten gewollt ist.
R-BPD-019.guidance=Timer-Dauern bevorzugt über Exposed Process Values steuern, damit sie je Umgebung angepasst werden können.
R-BPD-020.title=Auto-Tracking im Prozess aktiviert
R-BPD-020.category=Performance
R-BPD-020.rationale=Auto-Tracking schreibt für jede Aktivität jeder Instanz ein Tracking-Ereignis ins Performance Data Warehouse. Standardmäßig aktiv, entspricht es meist nicht dem Reporting-Bedarf und kostet bei jedem Schritt Datenbank-I/O.
R-BPD-020.guidance=Auto-Tracking im Prozess deaktivieren und explizite Tracking-Punkte/-Gruppen für die KPIs anlegen, die die Reports brauchen.
R-JS-001.title=SQL per String-Konkatenation gebaut
R-JS-001.category=Sicherheit
R-JS-001.rationale=Eine SQL-Anweisung wird aus Variablen per String-Konkatenation zusammengesetzt. Jeder Wert aus Benutzer- oder Fremdsystemdaten kann SQL injizieren (Datendiebstahl, Korruption). Zudem verhindert es Statement-Caching.
R-JS-001.guidance=Parameter-Marker (?) mit der Parameterliste der SQL Execute Statement nutzen (tw.local.parameters als SQLParameter[]), niemals Werte in die Anweisung konkatenieren.
R-JS-002.title=Variable in ein SQL-Template eingesetzt
R-JS-002.category=Sicherheit
R-JS-002.rationale=Ein Text-Template-Script (Server Script im Modus „text“) baut eine SQL-Anweisung und setzt Variablen mit <#= tw.local.x #> ein. Der eingesetzte Wert wird nicht escaped: benutzergesteuerte Werte ermöglichen SQL-Injection, und selbst harmlose Werte sprengen die Anweisung, wenn sie Anführungszeichen enthalten.
R-JS-002.guidance=Parameter-Marker (?) mit der SQLParameter-Liste des SQL Execute Statement nutzen; über Templates nur vertrauenswürdige Bezeichner (Tabellennamen aus EPVs) einsetzen.
R-JS-003.title=Zugriff auf interne BPM-Datenbanktabellen
R-JS-003.category=Sicherheit
R-JS-003.rationale=Das Skript referenziert interne Repository-/Runtime-Tabellen (LSW_*, BPM_*). Deren Struktur ist nicht supported, ändert sich zwischen Versionen, und direkter Zugriff bricht Migrationen und Support.
R-JS-003.guidance=Stattdessen die REST API, die JavaScript API (tw.system, TWProcessInstance …) oder die Views des Performance Data Warehouse nutzen – nicht die internen Tabellen.
R-JS-004.title=Thread.sleep in einem Skript
R-JS-004.category=Performance
R-JS-004.rationale=java.lang.Thread.sleep blockiert einen Server-Thread (und die JDBC-Verbindung/Transaktion) für die gesamte Wartezeit; unter Last erschöpft das den Thread-Pool.
R-JS-004.guidance=Wartezeiten über Timer-Ereignisse oder Undercover Agents abbilden; für Abfragen (Polling) ein Timer-Zwischenereignis mit Schleife nutzen.
R-JS-005.title=LiveConnect / Java-Klassenzugriff aus JavaScript
R-JS-005.category=Migration
R-JS-005.rationale=Das Skript nutzt LiveConnect (Packages.*, java.*, new java …), um Java direkt aufzurufen. LiveConnect ist deprecated, auf der neueren Engine nicht supported und in CP4BA-Containern blockiert.
R-JS-005.guidance=Durch einen Java-Integrationsservice (externe Java-Klasse über die Java-Integration-Komponente) oder einen REST-Aufruf ersetzen.
R-JS-006.title=eval / Function-Konstruktor
R-JS-006.category=Sicherheit
R-JS-006.rationale=eval() oder new Function() führt zur Laufzeit gebauten beliebigen Code aus; mit Benutzerdaten ist das eine Code-Injection, und jede statische Prüfung wird unmöglich.
R-JS-006.guidance=eval für Daten durch JSON.parse ersetzen, ebenso durch expliziten Property-Zugriff (obj[name]) oder einen Switch über bekannte Werte.
R-JS-007.title=Hartkodierte Credentials oder Secrets
R-JS-007.category=Sicherheit
R-JS-007.rationale=Ein Passwort, Secret, Token oder API-Key steht im Skript. Secrets im TWX sind für jeden Entwickler sichtbar und werden mit jedem Snapshot exportiert.
R-JS-007.guidance=Secret in eine Umgebungsvariable / ein EPV (je Umgebung gepflegt), einen Server-Credential (Process Admin > Server) oder einen Secure Vault verlagern und es von dort im Skript lesen.
R-JS-008.title=Hartkodierte Server-URL oder Host
R-JS-008.category=Konfiguration
R-JS-008.rationale=Eine http(s)://-URL, ein Hostname oder eine IP-Adresse steht hartkodiert im Skript; es bricht bei der Übernahme in eine andere Umgebung.
R-JS-008.guidance=URL in eine Umgebungsvariable oder ein EPV legen und mit tw.env / tw.epv lesen.
R-JS-009.title=Debug-Ausgabe im Code belassen
R-JS-009.category=Qualität
R-JS-009.rationale=log.info / console.log / alert in Skripten fluten die Logs (Server) oder unterbrechen den Nutzer (Client).
R-JS-009.guidance=Debug-Ausgaben entfernen oder über ein Log-Level-EPV absichern; log.error für echte Fehler behalten.
R-JS-010.title=toString() / XML-Serialisierung von Business Objekten in Mappings oder Skripten
R-JS-010.category=Performance
R-JS-010.rationale=Ein komplexes Objekt in einen String zu wandeln (toString(), toXMLString(), XML-Serialisierung) ist in Mappings oder Skripten teuer für große Objekte und Listen und meist unnötig.
R-JS-010.guidance=Objekt direkt mappen; JSON.stringify nur für kleine Payloads; tw.local.x.toString() in Bedingungen vermeiden.
R-JS-011.title=listLength in einer Schleifenbedingung
R-JS-011.category=Performance
R-JS-011.rationale=list.listLength (oder .length()) in der Schleifenbedingung wertet den TW-Listen-Wrapper bei jedem Durchlauf neu aus; bei großen Listen messbar langsamer.
R-JS-011.guidance=Länge vor der Schleife in eine lokale Variable zwischenspeichern: var n = tw.local.items.listLength; for (var i = 0; i < n; i++) …
R-JS-012.title=Synchrones XMLHttpRequest / blockierender Browser-Aufruf
R-JS-012.category=Performance
R-JS-012.rationale=Ein synchrones XMLHttpRequest (async=false) oder ein blockierender Dialog friert die Coach-Oberfläche ein und ist von den Browsern deprecated.
R-JS-012.guidance=Asynchrone Anfragen nutzen (Service-Call-Steuer, AJAX-Service über das Coach-Framework) sowie Callbacks/Promises.
R-JS-013.title=Globaler Variablenleck (Zuweisung ohne var/let/const)
R-JS-013.category=Qualität
R-JS-013.rationale=Eine Variable wird ohne Deklaration zugewiesen und wird damit global (Server: geteilt je Ausführungskontext; Browser: window). Globale kollidieren zwischen Coach Views und verstecken Fehler.
R-JS-013.guidance=Jede Variable (var/let/const) im engsten Gültigkeitsbereich deklarieren.
R-JS-014.title=Leerer Catch-Block
R-JS-014.category=Qualität
R-JS-014.rationale=Eine Ausnahme wird gefangen und ignoriert; Fehler werden unsichtbar, und spätere Schritte laufen mit falschen Daten.
R-JS-014.guidance=Fehler loggen (log.error) und ein Fehlerergebnis setzen, oder weiterwerfen (throw e), damit das Fehlerereignis feuert.
R-JS-015.title=Vergleiche mit == null / == undefined durch Typkonvertierung
R-JS-015.category=Qualität
R-JS-015.rationale=Lose Gleichheit (==) mit Strings/Zahlen verlässt sich auf Typkonvertierung und ist eine häufige Quelle subtiler Bugs (0 == '' ist true).
R-JS-015.guidance=== / !== verwenden, außer für die bewusste == null Idiom.
R-JS-016.title=Nutzung von tw.system.model / tw.system.executeServiceByName
R-JS-016.category=Qualität
R-JS-016.rationale=Dynamischer Service-Aufruf über den Namen (tw.system.executeServiceByName, tw.system.model.findProcessByName) ist als Abhängigkeit nicht sichtbar: „Where used“ übersieht ihn, Refactoring bricht ihn stillschweigend, und er umgeht die Typprüfung.
R-JS-016.guidance=Service direkt anhängen (verknüpfter Service / Unterprozess-Schritt), damit die Abhängigkeit explizit ist.
R-JS-017.title=Direkte DOM-Manipulation mit globalen Selektoren in einer Coach View
R-JS-017.category=UI
R-JS-017.rationale=Das Coach-View-Skript fragt das ganze Dokument ab (document.getElementById, $('#id'), document.querySelector) ohne this.context.element. Mit mehreren Instanzen der View auf einer Seite oder in einer Tabelle wird das falsche Element getroffen.
R-JS-017.guidance=Jede DOM-Abfrage auf die View beschränken: this.context.element.querySelector(...) / $(this.context.element).find(...).
R-JS-018.title=Externes Skript oder Ressource aus dem Internet geladen
R-JS-018.category=Sicherheit
R-JS-018.rationale=Die Coach View lädt ein Skript/Style von einem externen Host (CDN). Coach-Seiten erzwingen eine Content Security Policy (default-src 'self'), daher wird das Laden blockiert, und es hängt die UI von einem Internetzugang ab.
R-JS-018.guidance=Bibliothek als Toolkit-Web-Asset bündeln und als View-Ressource referenzieren.
R-JS-019.title=Deprecated / entferntes JavaScript-API
R-JS-019.category=Migration
R-JS-019.rationale=Das Skript nutzt ein API, das in BAW deprecated oder entfernt ist (tw.system.coachValidation, Heritage-Coach-APIs, escape/unescape, __proto__, arguments.callee, with-Anweisung).
R-JS-019.guidance=Durch das unterstützte Äquivalent ersetzen (tw.system.coachValidation → Client-seitige Validierung; encodeURIComponent; Object.getPrototypeOf; benannte Funktionen).
R-JS-020.title=Datum aus String-Parsing gebaut
R-JS-020.category=Qualität
R-JS-020.rationale=new Date('…') / Date.parse mit Nicht-ISO-Strings verhält sich je Browser und je Server-Locale unterschiedlich.
R-JS-020.guidance=tw.local-Daten (TWDate), new Date(year, month, day) oder ISO-8601-Strings verwenden.
R-JS-021.title=Skript zu lang
R-JS-021.category=Qualität
R-JS-021.rationale=Ein Script-Schritt / Handler hat mehr als 100 Zeilen (300 = kritisch). Lange Skripte sind schwer zu testen und zu prüfen; die Logik gehört meist in wiederverwendbare Service-Flows oder Toolkit-Funktionen.
R-JS-021.guidance=Skript in kleinere Schritte oder Services aufteilen; wiederverwendbare Funktionen in ein Toolkit-Web-Asset (Client) oder einen General System Service (Server) verlagern.
R-JS-022.title=JavaScript-Syntaxfehler
R-JS-022.category=Skript
R-JS-022.rationale=Das Skript wird nicht als JavaScript geparst. Es schlägt beim ersten Lauf des Schritts fehl.
R-JS-022.guidance=Syntax korrigieren (unbalancierte Klammern/Anführungszeichen, fehlende Operatoren). Server-Skripte müssen ES5 sein (Rhino): keine Pfeilfunktionen, let/const, Template-Strings.
R-JS-023.title=ES6+-Syntax in einem serverseitigen Skript
R-JS-023.category=Migration
R-JS-023.rationale=Server-Skripte laufen auf der Rhino-Engine (ECMAScript 5 in BPM 8.x / BAW 18-20). Pfeilfunktionen, let/const, Template-Literale, Klassen und Spread schlagen auf diesen Versionen zur Laufzeit fehl.
R-JS-023.guidance=In Server-Skripten ES5-Syntax nutzen (var, function, String-Konkatenation); ES6 nur für Client-seitigen Coach-View-Code.
R-JS-024.title=Tief verschachtelter Code
R-JS-024.category=Qualität
R-JS-024.rationale=Das Skript verschachtelt Blöcke mehr als 5 Ebenen tief; tief verschachtelte Logik ist fehleranfällig und schwer zu testen.
R-JS-024.guidance=Verschachtelte Blöcke in Funktionen / separate Schritte extrahieren, frühe Rückkehr (early return) nutzen.
R-JS-025.title=Undefinierte Kennung in einem serverseitigen Skript
R-JS-025.category=Skript
R-JS-025.rationale=Das Skript liest eine Variable oder Funktion, die nirgends deklariert ist: weder im Skript, noch ein BAW-JavaScript-API-Objekt (tw, log, TWDate …), noch eine Funktion einer Server-Datei der Anwendung oder ihrer Toolkits. Rhino wirft einen ReferenceError beim ersten Lauf der Anweisung.
R-JS-025.guidance=Variable deklarieren (var) oder das vorgesehene tw.local / tw.system-Mitglied nutzen; gemeinsame Funktionen in eine JavaScript-Server-Datei (Managed Asset) oder einen General System Service verlagern.
R-UI-001.title=Unaufgelöste Kennung in einem Coach-View-Skript
R-UI-001.category=UI
R-UI-001.rationale=Ein Coach-View-Handler oder Inline-Skript nutzt einen Namen, der weder in den Skripten der View deklariert ist, noch als AMD-Abhängigkeitsargument, noch ein globales Browser-/BPM-Coach-Global. Es ist entweder ein Tippfehler oder eine globale Variable aus einem eingebundenen Web-Asset (fragil: hängt von der Ladereihenfolge der Assets ab).
R-UI-001.guidance=Namen im Inline-Skript der View deklarieren, die Bibliothek als AMD-Abhängigkeit (functionArgument) hinzufügen oder explizit aus this.context / window lesen.
R-JS-026.title=Nicht deklarierte Prozessvariable (tw.local.x)
R-JS-026.category=Skript
R-JS-026.rationale=Das Skript, die Bedingung, das Mapping oder das Template nutzt tw.local.<name>, aber der Service / Prozess deklariert keinen Parameter oder private Variable mit diesem Namen. Zur Laufzeit ist der Wert undefined (Lesezugriff) oder die Zuweisung schlägt fehl.
R-JS-026.guidance=Variable im Reiter „Variablen“ des Services / Prozesses deklarieren oder den Namen korrigieren (Variablen eines aufgerufenen Services sind im Aufrufer nicht sichtbar).
R-JS-027.title=Definite Division durch Null
R-JS-027.category=Skript
R-JS-027.rationale=Ein Ausdruck dividiert durch das Literal 0 oder durch eine Variable, die gerade im geradlinigen Code auf 0 gesetzt wurde. Das Ergebnis ist Infinity oder NaN und pflanzt sich stillschweigend in die Fachdaten fort.
R-JS-027.guidance=Divisor vor der Division prüfen (if (n === 0) …) oder die Konstante korrigieren.
R-JS-028.title=Definiter null-/undefined-Property-Zugriff
R-JS-028.category=Skript
R-JS-028.rationale=Eine Property oder ein Element wird vom Literal null / undefined gelesen oder von einer Variable, die gerade im geradlinigen Code auf null oder undefined gesetzt wurde. Die Anweisung wirft jedes Mal einen TypeError.
R-JS-028.guidance=Variable initialisieren, bevor ihre Mitglieder genutzt werden, oder den Zugriff absichern (if (x) …).
R-JS-029.title=eval / Function-Konstruktor mit Prozessdaten
R-JS-029.category=Sicherheit
R-JS-029.rationale=eval() oder new Function() führt Code aus, der aus tw.local-Werten gebaut wurde (Benutzereingaben, Daten aus anderen Systemen). Wer diese Daten steuert, führt beliebigen JavaScript-Code auf dem Server (oder im Browser) aus.
R-JS-029.guidance=Niemals Daten als Code auswerten: JSON.parse für JSON-Strings, expliziter Property-Zugriff (obj[name]) oder ein Switch über die erlaubten Werte.
R-JS-030.title=Schleife ohne nachweisbaren Ausstieg
R-JS-030.category=Skript
R-JS-030.rationale=Eine while(true)- / for(;;)- / do..while(true)-Schleife enthält kein break, return oder throw, das sie verlässt. Sofern keine Ausnahme auftritt, endet der Schritt nie (die Transaktion timeoutet und der Thread blockiert).
R-JS-030.guidance=Explizite Ausstiegsbedingung einbauen (Schleifenzähler mit Maximum, break wenn die Arbeit erledigt ist).
R-JS-031.title=Aktive debugger-Anweisung
R-JS-031.category=Qualität
R-JS-031.rationale=Eine debugger-Anweisung ist im Code geblieben. Im Browser friert sie den Coach ein, sobald die Entwickler-Werkzeuge offen sind; auf dem Server ist sie toter Ballast, der unfertiges Debuggen dokumentiert.
R-JS-031.guidance=debugger-Anweisung entfernen.
R-JS-032.title=parseInt ohne explizite Radix
R-JS-032.category=Qualität
R-JS-032.rationale=parseInt(value) ohne Radix-Argument interpretiert Strings mit führender 0 auf älteren Engines als oktal (Rhino, alte Browser): parseInt('08') ergibt 0.
R-JS-032.guidance=Immer die Radix übergeben: parseInt(value, 10).
R-JS-033.title=Hartkodierte Geschäftskonstante
R-JS-033.category=Qualität
R-JS-033.rationale=Das Skript vergleicht oder weist kurze Großbuchstaben-String-Codes zu (Status-Codes wie 'A', 'NY', 'USD'). Über Skripte verstreute Geschäfts-Konstanten sind schwer konsistent zu ändern und verstecken die Bedeutung des Codes.
R-JS-033.guidance=Solche Codes in ein Exposed Process Value (EPV) oder eine dokumentierte Konstanten-Server-Datei legen und über den Namen referenzieren.
R-JS-034.title=Mögliche dynamische SQL-Konstruktion
R-JS-034.category=Sicherheit
R-JS-034.rationale=Eine nach SQL benannte Variable (sql, query, stmt …) wird per String-Konkatenation gebaut, oder eine Query-/Execute-Methode erhält einen konkatenierten String. Wenn ein konkatenierter Teil aus Benutzer- oder Fremdsystemdaten stammt, ist die Anweisung injizierbar.
R-JS-034.guidance=Parameter-Marker mit den SQL-Services nutzen (SQLParameter-Liste) oder ein Prepared Statement; nur vertrauenswürdige Bezeichner konkatenieren.
R-UI-002.title=Coach mit zu vielen Steuerelementen
R-UI-002.category=UI
R-UI-002.rationale=Ein Coach enthält mehr als 500 Steuerelemente (Layout-Items). Rendern und jedes Boundary-Event werden langsam; die Seite ist auf langsameren Clients unbenutzbar.
R-UI-002.guidance=Coach in mehrere Coaches / verschachtelte Human Services aufteilen, Deferred Sections und Paginierung für Listen nutzen.
R-UI-003.title=Coach View mit viel Inline-JavaScript
R-UI-003.category=UI
R-UI-003.rationale=Die Coach View enthält mehr als 300 Zeilen Inline-JavaScript. Große Inline-Skripte werden nicht vom Browser gecacht, können nicht unit-getestet werden und sind in jedem Coach dupliziert, das die View nutzt.
R-UI-003.guidance=Logik in ein Web-Asset (.js-Datei) verlagern, das als View-Ressource referenziert wird; das Inline-Skript nur für die Verdrahtung behalten.
R-UI-004.title=Coach View ohne Designzeit-Vorschau
R-UI-004.category=UI
R-UI-004.rationale=Die Coach View hat weder ein Vorschaubild noch eine erweiterte (HTML/JS-)Vorschau; sie erscheint als graues Rechteck im Process-Designer-Kanvas.
R-UI-004.guidance=Palette-Icon und erweiterte Vorschau (HTML-Snippet + Helper-JS) ergänzen, damit Designer das Steuerelement beim Bauen der Coaches sehen.
R-UI-005.title=Deprecated (Heritage) Coach-Steuerelemente
R-UI-005.category=Migration
R-UI-005.rationale=Der Coach nutzt Steuerelemente des Heritage-Coaches-Toolkits (Coaches / SYSC: Section, Table, Text, Button … der alten Standard-Steuerelemente) oder Heritage-Coach-Views, die zugunsten des BPM UI Toolkit deprecated sind und aus neueren Releases entfernt werden.
R-UI-005.guidance=Heritage-Steuerelemente durch die Entsprechungen des BPM UI Toolkit (BPMUI) ersetzen (Vertical Layout, Table, Text, Button …).
R-UI-006.title=Coach-View-Option ohne Label oder Dokumentation
R-UI-006.category=Dokumentation
R-UI-006.rationale=Konfigurationsoptionen ohne Label/Beschreibung werden im Designer mit ihrem technischen Namen angezeigt und sind schwer zu bedienen.
R-UI-006.guidance=Jeder Konfigurationsoption ein Label, eine Beschreibung und eine Gruppe geben.
R-UI-007.title=Coach View ohne Binding-Typ
R-UI-007.category=UI
R-UI-007.rationale=Die Coach View deklariert kein Business-Data-Binding; sie kann nur über Konfigurationsoptionen arbeiten. Für Layout-/Aktions-Views ist das in Ordnung, aber eine Daten-Steuerung ohne Binding ist nicht generisch wiederverwendbar.
R-UI-007.guidance=Binding-Typ (data) deklarieren, wenn die View Daten anzeigt oder bearbeitet.
R-UI-008.title=Vendor- / kommerzielle Bibliothek als Web-Asset gebündelt
R-UI-008.category=Lizenzen
R-UI-008.rationale=Ein Web-Asset-Name passt zu einer kommerziellen UI-Bibliothek (Webix, DevExtreme, Kendo, Sencha/ExtJS, Highcharts, ag-Grid Enterprise). Lizenzen müssen vor der Distribution geprüft werden, und solche Bibliotheken laden große Payloads in jeden Coach.
R-UI-008.guidance=Lizenz prüfen; die Steuerelemente des BPM UI Toolkit oder Open-Source-Bibliotheken bevorzugen, die einmal in einem gemeinsamen Toolkit gebündelt sind.
R-UI-009.title=Duplizierte Bibliotheksversionen in Web-Assets
R-UI-009.category=Qualität
R-UI-009.rationale=Mehrere Versionen derselben JavaScript-Bibliothek sind gebündelt (z. B. jquery-1.x und jquery-3.x, zwei bootstrap.min.js). Coaches laden widersprüchliche Kopien, und das Verhalten hängt von der Ladereihenfolge ab.
R-UI-009.guidance=Eine Version pro Bibliothek in einem gemeinsamen Toolkit behalten.
R-BO-001.title=Business Objekt mit zu vielen Attributen
R-BO-001.category=Daten
R-BO-001.rationale=Das Business Objekt hat mehr als 50 Properties. Jede Instanz-/Task-Speicherung serialisiert das ganze Objekt; breite Objekte verlangsamen die Engine und die Coaches.
R-BO-001.guidance=Objekt nach Anliegen aufteilen (z. B. Kopf / Details / Audit) und große Listen aus den Prozessvariablen heraushalten (Referenzen speichern, bei Bedarf laden).
R-BO-002.title=Shared Business Objekt
R-BO-002.category=Daten
R-BO-002.rationale=Das Business Objekt ist als „shared“ markiert (Shared Business Data). Shared-Objekte werden separat gespeichert und gesperrt; ohne Bedarf eingesetzt verlangsamen sie jeden Zugriff und verkomplizieren die Versionierung.
R-BO-002.guidance=Shared Business Objects nur nutzen, wenn Instanzen wirklich Daten teilen müssen; sonst „shared“ abwählen.
R-BO-003.title=Business Objekt ohne Dokumentation
R-BO-003.category=Dokumentation
R-BO-003.rationale=Das Business Objekt hat keine Beschreibung.
R-BO-003.guidance=Zweck und verantwortliche Domäne des Objekts dokumentieren.
R-BO-004.title=Properties ohne Dokumentation
R-BO-004.category=Dokumentation
R-BO-004.rationale=Properties haben keine Beschreibung.
R-BO-004.guidance=Jede Property beschreiben (Bedeutung, Format, erlaubte Werte).
R-BO-005.title=Property- oder Objektname folgt nicht den Konventionen
R-BO-005.category=Namensgebung
R-BO-005.rationale=Business-Objekt-Namen sollten UpperCamelCase und Property-Namen lowerCamelCase sein; andere Stile (Unterstriche, Leerzeichen, GROSSBUCHSTABEN) wirken in Skripten und JSON inkonsistent.
R-BO-005.guidance=Entsprechend der Konvention umbenennen (ObjectName / propertyName).
R-BO-006.title=Property vom Typ ANY
R-BO-006.category=Daten
R-BO-006.rationale=Eine Property ist vom Typ ANY. ANY-Werte werden nicht validiert, generisch serialisiert (langsam), und verschachtelte ANY-Listen werden nicht an Client-seitige Coaches ausgeliefert.
R-BO-006.guidance=Ein konkretes Business Objekt oder eine typisierte Liste verwenden.
R-QA-001.title=Artefaktname mit „copy“, „test“, „old“, „temp“ oder „delete“
R-QA-001.category=Qualität
R-QA-001.rationale=Der Artefaktname deutet auf einen Überrest hin (copy of, test, old, tmp, to delete, backup). Solche Artefakte verwirren Wartende und landen in Produktion.
R-QA-001.guidance=Veraltete Artefakte entfernen oder nach ihrem echten Zweck umbenennen.
R-QA-002.title=Duplizierte Artefaktnamen
R-QA-002.category=Qualität
R-QA-002.rationale=Zwei Artefakte desselben Typs haben denselben Namen (oder unterscheiden sich nur in Groß/Kleinschreibung/Leerzeichen) in der Anwendung oder über ihre Toolkits hinweg. Suche, Where-used und Konversationen werden mehrdeutig.
R-QA-002.guidance=Einen der beiden umbenennen; gemeinsame Artefakte in ein Toolkit verschieben.
R-QA-003.title=Team (Participant Group) mit statischer Mitgliederliste
R-QA-003.category=Konfiguration
R-QA-003.rationale=Das Team listet Nutzer mit Namen statt einer Gruppe / eines Team-Retrieval-Services. Mitgliederänderungen erfordern einen neuen Snapshot.
R-QA-003.guidance=Team an eine LDAP-/Sicherheitsgruppe oder einen Team-Retrieval-Service binden; die statische Liste leer halten.
R-QA-004.title=Undercover Agent ohne gekoppelten Service oder Ereignis
R-QA-004.category=Prozess
R-QA-004.rationale=Der UCA hat keinen gekoppelten Service (Nachrichtenereignisse können nicht verarbeitet werden) oder keine Zeitplan-/Ereignisdefinition.
R-QA-004.guidance=Den Service anhängen, der das Ereignis behandelt, und den Zeitplan oder die Nachricht konfigurieren.
R-QA-005.title=Exposed Process Value nicht genutzt
R-QA-005.category=Qualität
R-QA-005.rationale=Ein EPV der Anwendung wird von keinem Prozess oder Service referenziert.
R-QA-005.guidance=Ungenutzte EPVs löschen.
R-QA-006.title=Sehr großer Service (viele Schritte)
R-QA-006.category=Qualität
R-QA-006.rationale=Der Service hat mehr als 40 Schritte. Große Abläufe sind schwer zu lesen und zu testen; sie vermischen meist mehrere Verantwortlichkeiten.
R-QA-006.guidance=In kleinere Services aufteilen, die vom Hauptablauf aufgerufen werden.
R-QA-007.title=Schritte mit Default-Namen
R-QA-007.category=Qualität
R-QA-007.rationale=Schritte tragen noch ihre generierten Namen (Untitled, Script, Server Script, Service Task …). Diagramme und Logs sind unlesbar.
R-QA-007.guidance=Jeden Schritt nach seiner Funktion benennen.
R-SVC-020.title=Integrations- / Service-Aufruf in einer Schleife
R-SVC-020.category=Performance
R-SVC-020.rationale=Ein Schritt, der einen Web Service, Java-Connector, SQL-Service oder Decision Service aufruft, sitzt in einer Schleife des Service-Flows (einem Zyklus von Links). Jeder Durchlauf zahlt die vollen Aufrufkosten (Verbindung, Transaktion, Marshalling); bei großen Listen die häufigste Ursache langsamer Services.
R-SVC-020.guidance=Arbeit bündeln: Service einmal mit der ganzen Liste aufrufen, oder die Schleife in den aufgerufenen Service verlagern (eine Transaktion), Lookups außerhalb der Schleife zwischenspeichern.
R-SVC-021.title=Viele Schritte vor dem ersten Coach
R-SVC-021.category=UI
R-SVC-021.rationale=Ein Human Service läuft mehr als 5 Schritte (Skripte, Service-Aufrufe), bevor der erste Coach angezeigt wird. Der Nutzer wartet auf alle, bevor er etwas sieht.
R-SVC-021.guidance=Erst den Coach zeigen (mit den verfügbaren Daten) und Details danach mit Service-Call-/Ajax-Steuerelementen laden; Vorverarbeitung in den Prozess verlagern.
R-SVC-022.title=Service mit nur Start und Ende
R-SVC-022.category=Qualität
R-SVC-022.rationale=Der Service enthält keinen Schritt außer Start-/Endpunkt: ein leerer Platzhalter.
R-SVC-022.guidance=Service implementieren oder löschen.
R-SVC-023.title=Zu viele private Variablen
R-SVC-023.category=Qualität
R-SVC-023.rationale=Der Service oder Prozess deklariert mehr als 30 private Variablen; der Ausführungskontext wird groß (bei jedem Schritt serialisiert) und die Logik ist schwer nachvollziehbar.
R-SVC-023.guidance=Zusammengehörige Daten in Business Objekte gruppieren, ungenutzte Variablen entfernen, temporäre Werte lokal in Skripten halten.
R-SVC-024.title=Großer Ausführungskontext (Business-Data-Größe)
R-SVC-024.category=Performance
R-SVC-024.rationale=Die Variablen des Prozesses / Human Services erreichen mehr als 150 Attribute, wenn ihre Business Objekte aufgeklappt werden (Listen zählen als ihr Elementtyp). Der ganze Kontext wird bei jeder Aktivität, jedem Coach und jeder Speicherung serialisiert; große Kontexte verlangsamen alles und laufen an Datenbanklimits.
R-SVC-024.guidance=Nur behalten, was der Prozess braucht (Claim-Check-Muster: Dokumente/große Listen extern speichern und Referenzen übergeben), Business Objekte aufteilen, große Listen nach Gebrauch auf null setzen.
R-SVC-025.title=Eingabeparameter mit Standardwert
R-SVC-025.category=Qualität
R-SVC-025.rationale=Ein Eingabeparameter hat einen Standardwert. Aufrufer, die das Mapping vergessen, laufen stillschweigend mit dem Standard und verstecken Integrationsfehler.
R-SVC-025.guidance=Standardwerte aus Eingaben entfernen (fail fast) oder dokumentieren, warum der Standard gewollt ist.
R-SVC-026.title=Links mit Default-Namen
R-SVC-026.category=Qualität
R-SVC-026.rationale=Links aus Switches/Entscheidungen heißen noch „Untitled“; das Diagramm sagt nicht, welche Bedingung wohin führt.
R-SVC-026.guidance=Ausgehende Links von Entscheidungen nach ihrer Bedingung benennen (Ja / Nein / Fehler …).
R-SVC-027.title=Pre-/Post-Zuweisungen auf Start- oder Exit-Punkten
R-SVC-027.category=Qualität
R-SVC-027.rationale=Datenzuweisungen an Start oder Exit eines Services sind im Diagramm unsichtbar und laufen außerhalb der Fehlerbehandlung.
R-SVC-027.guidance=Zuweisungen in einen Script-Schritt neben Start / Exit verschieben.
R-SVC-028.title=Viele Pre-/Post-Zuweisungen auf einem Schritt
R-SVC-028.category=Qualität
R-SVC-028.rationale=Ein Schritt trägt mehr als 10 Pre-/Post-Zuweisungen; Logik, die in Zuweisungen versteckt ist, ist schwer zu lesen und zu debuggen.
R-SVC-028.guidance=Zuweisungen durch einen expliziten Script-Schritt oder saubere Daten-Mappings ersetzen.
R-SVC-029.title=Service oder Prozess für All Users exponiert
R-SVC-029.category=Sicherheit
R-SVC-029.rationale=Das Artefakt ist für den Default-Participant „All Users“ exponiert (startbar / URL / Dashboard).
R-SVC-029.guidance=Nur einem dedizierten Team exponieren.
R-SVC-030.title=„Unknown“- oder Platzhaltertext in Schrittnamen und Dokumentation
R-SVC-030.category=Qualität
R-SVC-030.rationale=Schrittnamen oder Dokumentation enthalten „unknown“, „TODO“, „FIXME“ oder „deprecated“.
R-SVC-030.guidance=Markierte Artefakte fertigstellen oder entfernen; deprecatede löschen.
R-SVC-031.title=Komplexitätsgrad (Schritte + Entscheidungen + Schleifen)
R-SVC-031.category=Qualität
R-SVC-031.rationale=Zyklomatische Komplexität des Ablaufs (Links − Schritte + 2 × Entscheidungspfade) über 30: Das Artefakt ist kaum vollständig testbar.
R-SVC-031.guidance=Ablauf in Unterservices / Unterprozesse mit je einer Verantwortlichkeit aufteilen.
R-BPD-021.title=Prozess mit zu vielen Aktivitäten
R-BPD-021.category=Prozess
R-BPD-021.rationale=Der Prozess hat mehr als 30 Ablaufobjekte. Große Diagramme sind schwer zu lesen; Unterprozesse und verknüpfte Prozesse halten den Hauptablauf verständlich.
R-BPD-021.guidance=Phasen in Unterprozesse / verknüpfte Prozesse gruppieren.
R-BPD-022.title=Prozess ohne Notizen / Dokumentation im Diagramm
R-BPD-022.category=Dokumentation
R-BPD-022.rationale=Das Diagramm hat keine Notiz-Elemente; komplexe Prozesse profitieren von Notizen, die die Geschäftsregeln im Diagramm erklären.
R-BPD-022.guidance=Notizen für Gateways und nicht offensichtliche Pfade ergänzen.
R-JS-035.title=Verschachtelte Schleifen
R-JS-035.category=Performance
R-JS-035.rationale=Eine Schleife in einer Schleife (quadratisches Verhalten) auf serverseitigen Listen; bei TW-Listen-Wrappern ist jeder Zugriff langsam.
R-JS-035.guidance=Die innere Liste zuerst in eine Map indexieren (Objekt über der ID), dann in der äußeren Schleife nachschlagen.
R-JS-036.title=Tiefes Kopieren / Serialisieren in einer Schleife
R-JS-036.category=Performance
R-JS-036.rationale=JSON.stringify/parse, clone(), toXML oder tw.system.serializer werden in einer Schleife genutzt; jeder Durchlauf kopiert ganze Objekte.
R-JS-036.guidance=Einmal außerhalb der Schleife kopieren oder nur die benötigten Felder kopieren.
R-JS-037.title=Hartkodierter JNDI-Datenquelle, Queue oder WSDL-Endpoint
R-JS-037.category=Konfiguration
R-JS-037.rationale=Ein JNDI-Name (jdbc/…, jms/…) oder eine WSDL-/Endpoint-URL steht hartkodiert in einem Skript oder Mapping; er muss je Umgebung geändert werden.
R-JS-037.guidance=Umgebungsvariable / EPV für Datenquellenamen und Endpoints nutzen (oder die Server-Definitionen in den Prozesseinstellungen).
R-JS-038.title=Nutzung von tw.system.serializer / XML-API
R-JS-038.category=Performance
R-JS-038.rationale=tw.system.serializer, E4X-XML-Objekte oder toXMLString sind langsam und in BAW deprecated.
R-JS-038.guidance=JSON (JSON.stringify / JSON.parse) und typisierte Business Objekte nutzen.
R-JS-039.title=Übermäßiges Logging
R-JS-039.category=Performance
R-JS-039.rationale=Ein Skript enthält mehr als 5 Log-Ausgaben (log.info / log.debug); in Produktion flutet das das SystemOut und kostet I/O.
R-JS-039.guidance=Eine Log-Ausgabe je Geschäftsereignis behalten, log.debug durch ein Level-EPV abgesichert nutzen.
R-JS-040.title=Duplizierte Funktionsdefinitionen über Skripte hinweg
R-JS-040.category=Qualität
R-JS-040.rationale=Dieselbe Funktionsname ist in mehreren Skripten / Coach Views der Anwendung definiert: kopierter Code, der an jeder Stelle gepflegt werden muss.
R-JS-040.guidance=Gemeinsame Funktionen in ein Toolkit-Web-Asset (Client) oder einen General System Service (Server) verlagern.
R-UI-010.title=Polling mit setInterval in einer Coach View
R-UI-010.category=Performance
R-UI-010.rationale=Die Coach View pollt den Server mit setInterval-/setTimeout-Schleifen; jeder offene Coach erzeugt konstante Last.
R-UI-010.guidance=Boundary-Events / Service-Call-Steuerelemente nutzen, die durch Nutzeraktionen ausgelöst werden, oder lange Intervalle mit Stoppbedingung.
R-UI-011.title=Statische DOM-IDs in einer Coach View
R-UI-011.category=UI
R-UI-011.rationale=Das HTML oder die Skripte der Coach View nutzen feste Element-IDs (id="…" ohne $$viewDOMID$$). Zwei Instanzen der View auf einer Seite (Tabellen, wiederholende Abschnitte) kollidieren.
R-UI-011.guidance=Klassen-Selektoren nutzen, die auf this.context.element beschränkt sind, oder IDs mit $$viewDOMID$$ prefixieren.
R-UI-012.title=Change-Handler ohne Property-Prüfung
R-UI-012.category=UI
R-UI-012.rationale=Der Change-Handler reagiert auf jedes Change-Event (Binding, Optionen, Sichtbarkeit) ohne Prüfung von event.property; er rendert zu oft neu und kann looppen, wenn er selbst Werte setzt.
R-UI-012.guidance=Den Handler mit einer Prüfung von event.property (und event.type) beginnen und sonst zurückkehren.
R-UI-013.title=Lifecycle-Methoden direkt aufgerufen
R-UI-013.category=UI
R-UI-013.rationale=Die Coach View ruft this.load(), this.view() oder this.change() selbst auf; das Framework ruft sie auf, manuelle Aufrufe führen die Initialisierung zweimal aus und brechen die Event-Reihenfolge.
R-UI-013.guidance=Gemeinsamen Code in eine private Funktion verlagern, die von den Lifecycle-Methoden aufgerufen wird.
R-UI-014.title=Coach View ohne Prototype-Level-Funktionen
R-UI-014.category=Performance
R-UI-014.rationale=Das Inline-JavaScript wird je Instanz ausgeführt („Prototype-Level Functions“ nicht angehakt). Mit vielen Instanzen (Tabellen, wiederholende Abschnitte) erzeugt jede Instanz alle Funktionen neu.
R-UI-014.guidance=Prototype-Level Functions aktivieren, wenn die View keinen instanzbezogenen Closure-Zustand hat, oder das Inline-Skript klein halten.
R-UI-015.title=AMD-Modulabhängigkeit deklariert, aber nicht genutzt
R-UI-015.category=Qualität
R-UI-015.rationale=Die Coach View deklariert AMD-Abhängigkeiten, deren Funktionsargument in ihren Skripten nie vorkommt; sie werden umsonst geladen.
R-UI-015.guidance=Ungenutzte AMD-Abhängigkeiten entfernen.
R-UI-016.title=Viele JavaScript- / CSS-Ressourcen auf einer Coach View
R-UI-016.category=Performance
R-UI-016.rationale=Die Coach View bindet mehr als 4 Skript- oder Style-Dateien ein; jede ist eine separate Anfrage bei jedem Coach-Laden.
R-UI-016.guidance=Dateien kombinieren (ein minifiziertes Bundle pro Bibliothek) und über ein Toolkit teilen.
R-UI-017.title=Dojo, jQuery und reine DOM-APIs in einer Coach View gemischt
R-UI-017.category=Qualität
R-UI-017.rationale=Die Coach View mischt dojo (require/dojo.*), jQuery ($) und direkte DOM-Aufrufe; drei Wege für dasselbe machen den Code schwer wartbar und laden zusätzliche Bibliotheken.
R-UI-017.guidance=Ein Konzept pro Toolkit wählen (die Steuerelemente des BPM UI Toolkit nutzen reine DOM + dojo).
R-UI-018.title=Binding ohne Null-Prüfung in einer Coach View genutzt
R-UI-018.category=Qualität
R-UI-018.rationale=Skripte verketten Property-Zugriff direkt an context.binding.get("value") (z. B. .get("value").name); wenn die View ungebunden ist oder der Wert null, wirft das Skript.
R-UI-018.guidance=Wert in eine Variable lesen und prüfen, bevor seine Properties genutzt werden.
R-APP-020.title=Toolkit-Abhängigkeit nicht genutzt
R-APP-020.category=Abhängigkeiten
R-APP-020.rationale=Die Anwendung hängt von einem Toolkit ab, referenziert aber keines seiner Artefakte.
R-APP-020.guidance=Abhängigkeit entfernen (Process Designer: Toolkit entfernen).
R-APP-021.title=Umgebungsvariable in mehreren Paketen definiert
R-APP-021.category=Konfiguration
R-APP-021.rationale=Derselbe Umgebungsvariablenname ist in der Anwendung und in einem Toolkit (oder in zwei Toolkits) definiert; welcher Wert gewinnt, hängt von der Auflösungsreihenfolge ab und verwirrt Administratoren.
R-APP-021.guidance=Jede Umgebungsvariable genau einmal definieren, in dem Paket, dem sie gehört.
R-APP-022.title=Umgebungsvariable nie genutzt
R-APP-022.category=Qualität
R-APP-022.rationale=Eine Umgebungsvariable ist definiert, aber kein Skript referenziert tw.env.<name>.
R-APP-022.guidance=Ungenutzte Umgebungsvariablen entfernen.
R-APP-023.title=Großes oder nicht minifiziertes Web-Asset
R-APP-023.category=Performance
R-APP-023.rationale=Ein JavaScript/CSS-Web-Asset ist größer als 300 KB oder nicht minifiziert (viele Zeilenumbrüche); jeder Coach, der es einbindet, lädt es herunter.
R-APP-023.guidance=Bibliotheken minifizieren und gzipped ausliefern, selten genutzten Code auslagern, Assets unter 300 KB halten.
R-APP-024.title=Dasselbe Web-Asset in mehreren Paketen gebündelt
R-APP-024.category=Qualität
R-APP-024.rationale=Ein Web-Asset mit demselben Namen existiert in der Anwendung und in einem ihrer Toolkits (oder in zwei Toolkits); Coaches laden zwei verschiedene Versionen.
R-APP-024.guidance=Eine Kopie in einem gemeinsamen UI-Toolkit behalten.
R-QA-008.title=EPV / Resource Bundle mit Service verknüpft, aber nicht genutzt
R-QA-008.category=Qualität
R-QA-008.rationale=Der Service verknüpft ein Exposed Process Value oder Resource Bundle, auf das keines seiner Skripte zugreift.
R-QA-008.guidance=Ungenutzte Verknüpfung entfernen.
R-QA-009.title=Prozessvariable vom Typ ANY
R-QA-009.category=Daten
R-QA-009.rationale=Eine Variable ist vom Typ ANY: keine Validierung, generische Serialisierung und keine Unterstützung verschachtelter Listen in Client-seitigen Coaches.
R-QA-009.guidance=Ein konkretes Business Objekt verwenden.
