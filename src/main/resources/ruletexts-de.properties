# Deutsche Katalogtexte der Regeln R-<KAT>-<nnn> (Schluessel: R<id>.title/.category/.rationale/.guidance).
# Der englische Originaltext bleibt in den Regelklassen und dient als titleEn/categoryEn/rationaleEn/guidanceEn.
R-APP-001.title=Zu viele Toolkit-Abhängigkeiten
R-APP-001.category=Anwendung
R-APP-001.rationale=Die Anwendung hängt von mehr Toolkits ab als das empfohlene Maximum (25). Jedes Toolkit erhöht Classloading-, Snapshot- und Deployment-Aufwand und vergrößert die Änderungsfläche.
R-APP-001.guidance=Kleine Toolkits zusammenlegen, ungenutzte Abhängigkeiten entfernen (Process Designer: Toolkits entfernen) und je Domäne ein gemeinsames Utility-Toolkit bevorzugen.
R-APP-002.title=Toolkit in mehreren Versionen
R-APP-002.category=Anwendung
R-APP-002.rationale=Der Abhängigkeitsbaum enthält dasselbe Toolkit in zwei oder mehr Snapshot-Versionen. Objekte beider Versionen werden geladen, das Verhalten hängt davon ab, welche Kopie zuerst aufgelöst wird, und Upgrades werden unberechenbar.
R-APP-002.guidance=Alle Abhängigkeiten (Anwendung und Toolkits) auf einen Snapshot des Toolkits ausrichten; Toolkits aktualisieren, die noch die ältere Version referenzieren.
R-APP-003.title=Tiefe Toolkit-Verschachtelung
R-APP-003.category=Anwendung
R-APP-003.rationale=Toolkit-Abhängigkeiten sind tiefer als 4 Ebenen verschachtelt. Tiefe Ketten verlangsamen die Snapshot-Auflösung und machen Versionskonflikte (R001) wahrscheinlich.
R-APP-003.guidance=Abhängigkeitskette abflachen: Die Anwendung soll direkt von den Toolkits abhängen, die sie nutzt; Toolkits vermeiden, die nur andere Toolkits weiterreichen.
R-APP-004.title=Großes Toolkit
R-APP-004.category=Anwendung
R-APP-004.rationale=Ein Toolkit ist größer als 50 MB. Große Toolkits (meist wegen gebündelter Web-Assets oder Bibliotheken) verlangsamen Installation, Snapshot-Erstellung und Process Designer.
R-APP-004.guidance=Große statische Assets aus dem Toolkit auslagern (externer Webserver oder ein eigenes Asset-Toolkit), veraltete Dateien sowie minizierte/nicht minizierte Duplikate entfernen.
R-APP-005.title=Zu viele client-seitige Human Services
R-APP-005.category=Anwendung
R-APP-005.rationale=Die Anwendung enthält mehr Client-seitige Human Services als das empfohlene Maximum (50). Sehr große Anwendungen sind schwer zu pflegen, lassen sich langsam im Process Designer öffnen und deployen und vermischen meist mehrere Geschäftsdomainen.
R-APP-005.guidance=Anwendung nach Geschäftsfähigkeiten aufteilen, wiederverwendbare Services und Business Objekte in Toolkits auslagern, ungenutzte Artefakte archivieren.
