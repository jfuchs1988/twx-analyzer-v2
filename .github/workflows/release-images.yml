name: Publish release images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to attach downloadable image archives to
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish container images
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up pinned npm
        run: npm install --global npm@12.2.1 --no-audit --no-fund

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Lint, test, and build frontend
        working-directory: frontend
        run: |
          npm run lint
          npm test
          npm run build

      - name: Test and package backend
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$RUNNER_TEMP/maven-repository:/root/.m2" \
            -w /workspace \
            docker.io/library/maven:3.10.0-eclipse-temurin-25 \
            sh -c "mvn -B -ntp -Djacoco.destFile=target/jacoco.exec -Djacoco.dataFile=target/jacoco.exec test && mvn -B -ntp -DskipTests package"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare API image metadata
        id: meta-api
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and publish API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Prepare frontend image metadata
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-frontend
          tags: |
            type=ref,event=tag
            type=ref,event=branch
            type=sha
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and publish frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}

      - name: Attach image archives to GitHub Release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          set -euo pipefail
          api_image="ghcr.io/${GITHUB_REPOSITORY}-api:${RELEASE_TAG}"
          frontend_image="ghcr.io/${GITHUB_REPOSITORY}-frontend:${RELEASE_TAG}"
          api_archive="twx-analyzer-v2-api-${RELEASE_TAG}.tar.gz"
          frontend_archive="twx-analyzer-v2-frontend-${RELEASE_TAG}.tar.gz"

          docker pull "$api_image"
          docker pull "$frontend_image"
          docker save "$api_image" | gzip -1 > "$api_archive"
          docker save "$frontend_image" | gzip -1 > "$frontend_archive"
          sha256sum "$api_archive" "$frontend_archive" > SHA256SUMS.txt

          gh release upload "$RELEASE_TAG" \
            "$api_archive" \
            "$frontend_archive" \
            SHA256SUMS.txt \
            --clobber
