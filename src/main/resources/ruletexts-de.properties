R-APP-006.category=Anwendung
R-APP-006.rationale=Die Anwendung enthält mehr Heritage Human Services als das empfohlene Maximum (25). Sehr große Anwendungen sind schwer zu pflegen, lassen sich langsam im Process Designer öffnen und deployen und vermischen meist mehrere Geschäftsdomainen.
R-APP-006.guidance=Anwendung nach Geschäftsfähigkeiten aufteilen, wiederverwendbare Services und Business Objekte in Toolkits auslagern, ungenutzte Artefakte archivieren.
